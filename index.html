<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Readora</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Main Login -->
    <main class="login-container">

        <section class="login-card">

            <header class="login-header">
                <span class="brand-label">YOUR PERSONAL BOOKSTORE</span>
                <h1>Readora.</h1>
                <p>Temukan cerita dan pengetahuan baru bersama kami.</p>
            </header>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Masukkan email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">
                    Login
                </button>

            </form>

            <div class="login-links">

                <button type="button" id="forgotBtn">
                    Lupa Password?
                </button>

                <p>
                    Belum punya akun?
                    <button type="button" id="registerBtn">
                        Daftar
                    </button>
                </p>

            </div>

            <footer class="login-footer">
                <p>READ • EXPLORE • DISCOVER</p>
            </footer>

        </section>

    </main>


    <!-- Modal Lupa Password -->
    <div class="modal" id="forgotModal">

        <div class="modal-content">

            <button type="button" class="close-modal"
                data-close="forgotModal">&times;</button>

            <h2>Lupa Password?</h2>

            <p>Masukkan email yang terdaftar untuk memeriksa akunmu.</p>

            <form id="forgotForm">

                <div class="form-group">
                    <label for="forgotEmail">Email</label>
                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Masukkan email"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">
                    Periksa Email
                </button>

            </form>

        </div>

    </div>


    <!-- Modal Daftar -->
    <div class="modal" id="registerModal">

        <div class="modal-content">

            <button type="button" class="close-modal"
                data-close="registerModal">&times;</button>

            <h2>Buat Akun Readora</h2>

            <p>Daftarkan dirimu untuk mulai menjelajahi buku.</p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="registerName">Nama Lengkap</label>
                    <input
                        type="text"
                        id="registerName"
                        placeholder="Masukkan nama"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Masukkan email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimal 6 karakter"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">
                    Daftar Sekarang
                </button>

            </form>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
