<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok Buku | Readora</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 25px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-family: Georgia, serif;
            color: var(--dark-brown);
        }

        .back-link {
            color: var(--brown);
            text-decoration: none;
            font-weight: bold;
        }

        .catalog-card, .form-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .catalog-card h2, .form-card h2 {
            font-family: Georgia, serif;
            color: var(--dark-brown);
            margin-bottom: 18px;
        }

        .search-input, .form-card input {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--border);
            border-radius: 7px;
            margin-bottom: 15px;
            background: var(--cream);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .catalog-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        .catalog-table th, .catalog-table td {
            padding: 13px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-size: 13px;
        }

        .catalog-table th {
            background: var(--beige);
            color: var(--dark-brown);
        }

        .btn-add {
            background: var(--brown);
            color: white;
            border: none;
            border-radius: 7px;
            padding: 12px 18px;
            font-weight: bold;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 18px;
        }

        .form-card label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
            color: var(--dark-brown);
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <main class="page-container">
        <header class="page-header">
            <div>
                <h1>Informasi Stok Buku</h1>
                <p>Kelola koleksi buku yang tersedia di Readora.</p>
            </div>
            <a href="dashboard.html" class="back-link">← Kembali ke Dashboard</a>
        </header>

        <section class="catalog-card">
            <h2>Daftar Katalog Buku</h2>

            <input
                type="text"
                id="cariBuku"
                class="search-input"
                placeholder="Cari judul atau penulis buku..."
            >

            <div class="table-wrapper">
                <table class="catalog-table">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Judul Buku</th>
                            <th>Penulis</th>
                            <th>Kategori</th>
                            <th>Harga</th>
                            <th>Stok</th>
                        </tr>
                    </thead>
                    <tbody id="catalogTable">
                    </tbody>
                </table>
            </div>
        </section>

        <section class="form-card">
            <h2>Tambah Buku Baru</h2>

            <form id="formTambahBuku">
                <div class="form-grid">
                    <div>
                        <label for="judulBuku">Judul Buku</label>
                        <input type="text" id="judulBuku" required>
                    </div>

                    <div>
                        <label for="penulisBuku">Penulis</label>
                        <input type="text" id="penulisBuku" required>
                    </div>

                    <div>
                        <label for="kategoriBuku">Kategori</label>
                        <input type="text" id="kategoriBuku" required>
                    </div>

                    <div>
                        <label for="hargaBuku">Harga (Rp)</label>
                        <input type="number" id="hargaBuku" min="1" required>
                    </div>

                    <div>
                        <label for="stokBuku">Jumlah Stok</label>
                        <input type="number" id="stokBuku" min="0" required>
                    </div>
                </div>

                <button type="submit" class="btn-add">+ Tambahkan Buku</button>
            </form>
        </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
